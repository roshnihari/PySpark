[project]
name = "dq-agent"
version = "0.1.0"
description = "Agentic data quality and masking assistant built on PySpark"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "pydantic>=2.6",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
